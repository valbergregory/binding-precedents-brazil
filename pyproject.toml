[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bpb"
version = "0.0.1"
description = "Binding Precedents Brazil: ingestion, parsing and NLP for the precedent-diffusion study"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Valber Gregory"}]
dependencies = [
  "requests>=2.32",
  "httpx>=0.27",
  "pandas>=2.2",
  "polars>=1.0",
  "pyarrow>=16",
  "duckdb>=1.0",
  "pydantic>=2.7",
  "beautifulsoup4>=4.12",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
nlp = [
  "scikit-learn>=1.5",
  "sentence-transformers>=3.0",
  "transformers>=4.44",
  "torch>=2.3",
  "networkx>=3.3",
]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src/python"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
