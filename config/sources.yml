# Verified data sources. Every entry was probed from this machine on the date in `verified_on`.
# `access` describes what actually worked. Do not add a source without probing it.
# Status codes: ok = usable programmatically; manual = usable only through a browser/UI;
# partial = reachable but incomplete for our purpose; blocked = not usable.

