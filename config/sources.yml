cnj_resolucao_615_2025:
  provider: CNJ
  status: reference
  verified_on: "2026-09-04"
  url: https://atos.cnj.jus.br/atos/detalhar/6001
  notes: >
    Resolution of 11 March 2025 (in force since 14 July 2025) on AI governance in the Judiciary,
    replacing Resolution 332/2020. Applies directly to courts; for this external study it is a
    normative benchmark for transparency, human oversight and risk classification of AI outputs.
