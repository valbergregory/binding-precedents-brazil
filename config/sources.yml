  ckan_package_show: https://dadosabertos.web.stj.jus.br/api/3/action/package_show?id=precedentes-qualificados
  resources:
    temas_csv: https://dadosabertos.web.stj.jus.br/dataset/4238da2f-c07b-4c1a-b345-4402accacdcf/resource/df29da13-7d6b-41ba-ad96-cd1a5bbd191c/download/temas.csv
    processos_csv: https://dadosabertos.web.stj.jus.br/dataset/4238da2f-c07b-4c1a-b345-4402accacdcf/resource/7ed21202-0049-4fcb-aa7c-48d810d3c499/download/processos.csv
    dicionario_temas: https://dadosabertos.web.stj.jus.br/dataset/4238da2f-c07b-4c1a-b345-4402accacdcf/resource/d5e50514-6dba-4f1e-8557-94f135eae03b/download/dicionario-temas.csv
    dicionario_processos: https://dadosabertos.web.stj.jus.br/dataset/4238da2f-c07b-4c1a-b345-4402accacdcf/resource/162e58f0-01c1-4d91-94a4-664b4de81e79/download/dicionario-processos.csv
  observed:
    temas_rows: 2400
    temas_by_type: {Tema: 1502, Controvérsia: 837, PUIL: 27, IAC: 23, SIRDR: 11}
    processos_rows: 5539
    last_modified: "2026-09-03"
    notes: >
      tipoPrecedente value for repetitive themes is the string "Tema" (not "Tema Repetitivo").
      dataJulgamento is empty for 345 of 1502 themes (mostly cancelled/pending); processos.csv
      carries per-paradigm dates and court of origin (siglaTribunalOrigem, origemUF, tipoJusticaOrigem).
      quantidadeProcessosSuspensoNaOrigem is 0 in every row and must not be used.

stj_integras_decisoes:
  provider: STJ Portal de Dados Abertos (CKAN)
  license: CC-BY
  status: ok
  verified_on: "2026-09-04"
  dataset_page: https://dadosabertos.web.stj.jus.br/dataset/integras-de-decisoes-terminativas-e-acordaos-do-diario-da-justica
  ckan_package_show: https://dadosabertos.web.stj.jus.br/api/3/action/package_show?id=integras-de-decisoes-terminativas-e-acordaos-do-diario-da-justica
  resource_pattern:
    metadata: metadados{YYYYMMDD}.json   # list of records; dates in epoch milliseconds
    texts: textos{YYYYMMDD}.zip          # {YYYYMMDD}/{seqDocumento}.txt, UTF-8, "<br>" line breaks
  observed:
    resources: 2583
    coverage: "2021-01-04 to 2026-08-26 (daily on publication days)"
    compressed_total_bytes: 13244706289
    sample_day_2023_05_10: {metadata_records: 2791, texts: 2743, avg_text_bytes: 10505, decisoes: 1551, acordaos: 1240}
    fields: [seqDocumento, dataPublicacao, tipoDocumento, numeroRegistro, processo, dataRecebimento, dataDistribuicao, ministro, recurso, teor, descricaoMonocratica, assuntos]
    notes: >
      No court-of-origin field and no CNJ case number in metadata. Origin must be recovered via
      atas de distribuição (numeroRegistro -> numeroUnico), acervo snapshot, or regex on the text.
      Secret-of-justice cases are excluded by the provider.

stj_espelhos_acordaos:
  provider: STJ Portal de Dados Abertos (CKAN)
  license: CC-BY
  status: ok
  verified_on: "2026-09-04"
  datasets:
    - espelhos-de-acordaos-corte-especial
    - espelhos-de-acordaos-primeira-secao
    - espelhos-de-acordaos-segunda-secao
    - espelhos-de-acordaos-terceira-secao
    - espelhos-de-acordaos-primeira-turma
    - espelhos-de-acordaos-segunda-turma
    - espelhos-de-acordaos-terceira-turma
    - espelhos-de-acordaos-quarta-turma
    - espelhos-de-acordaos-quinta-turma
    - espelhos-de-acordaos-sexta-turma
  resource_pattern:
    historical: "20220507.zip or 20220508.zip (full history to May 2022)"
    monthly: "{YYYYMMDD}.json (increments since previous month, to 2026-06-30)"
  observed:
    primeira_secao_total_bytes: 33994087
    segunda_turma_total_bytes: 156343921
    fields: [id, numeroProcesso, numeroRegistro, siglaClasse, descricaoClasse, nomeOrgaoJulgador, ministroRelator, ementa, tipoDeDecisao, dataDecisao, decisao, jurisprudenciaCitada, notas, informacoesComplementares, termosAuxiliares, teseJuridica, tema, referenciasLegislativas, acordaosSimilares, dataPublicacao]
    notes: >
      Curated subset (only judgments with documentary treatment). Structured fields `tema`,
      `teseJuridica`, `jurisprudenciaCitada` make it a validation source for the regex extractor.
      Same decision may appear in several files; deduplicate on `id`.

stj_atas_distribuicao:
  provider: STJ Portal de Dados Abertos (CKAN)
  license: CC-BY
  status: ok
  verified_on: "2026-09-05"
  ckan_package_show: https://dadosabertos.web.stj.jus.br/api/3/action/package_show?id=atas-de-distribuicao
  observed:
    resources: 1006
    coverage: "ata20230630.json to ata20260904.json (daily)"
    total_bytes: 4158444962
    key_fields: [numeroUnico, numeroRegistro, dataHoraDistribuicao, siglaClasse, codigoClasseCNJ, numeroNaClasse, codigoOrgaoJulgador, nomeMinistroRelator, codigoAssuntoCNJ]
    personal_data_fields_to_drop: [partes, advogados]
    notes: >
      numeroUnico is the CNJ unified number, whose J.TR segment identifies the court of origin
      (e.g. 8.26 = TJSP, 4.04 = TRF4). This is the deterministic crosswalk numeroRegistro -> origin
      for cases distributed from 2023-06-30 onwards.

