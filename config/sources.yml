cnj_datajud_api:
  provider: CNJ DataJud API Pública
  license: CNJ terms of use (non-commercial; notify CNJ of publications; no accuracy guarantee)
  status: ok
  verified_on: "2026-09-05"
  wiki: https://datajud-wiki.cnj.jus.br/api-publica/
  endpoint_pattern: https://api-publica.datajud.cnj.jus.br/api_publica_{alias}/_search
  auth: "HTTP header `Authorization: ApiKey <public key published on the wiki Acesso page>`; store in DATAJUD_API_KEY"
  query: "POST, Elasticsearch query DSL; size up to 10000; paginate with sort on @timestamp + search_after"
  observed:
    stj_index_hits: ">= 10000 (match_all)"
    tjsp_index_hits: ">= 10000 (match_all)"
    fields: [id, tribunal, grau, numeroProcesso, dataAjuizamento, nivelSigilo, orgaoJulgador, classe, sistema, formato, dataHoraUltimaAtualizacao, movimentos, assuntos]
    notes: >
      Metadata only: no decision text, no ementa, no theme linkage. Use for durations, movements,
      case flow (RQ5) and as an origin/assunto crosswalk keyed on numeroProcesso (CNJ number).

cnj_bnp_pangea:
  provider: CNJ / PDPJ-Br Banco Nacional de Precedentes (Pangea)
  license: not stated on the public page
  status: manual
  verified_on: "2026-09-05"
  portal: https://bnp.pdpj.jus.br/
  frontend_backend_url: https://pangeabnp.pdpj.jus.br/api/v1   # from the SPA's public env.js
  documentation: http://docs.pdpj.jus.br/servicos-negociais/pangeabnp/
  manual: http://docs.pdpj.jus.br/servicos-negociais/BNP-Pangea/BNP%20-%20Manual%20de%20Utiliza%C3%A7%C3%A3o/
  observed:
    notes: >
      No documented public bulk API. Official docs describe an integration API for courts using
      OAuth2 client credentials through the PDPJ SSO. A blind POST to /api/v1/precedentes returned
      HTTP 500 (unknown request schema). Manual mentions no CSV/XML export. Treat BNP as a manual
      verification/complement source, not as a bulk source.

